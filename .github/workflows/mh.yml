name: Metropolis-Hastings ETFs

# Actions tab → "Metropolis-Hastings ETFs" → Run workflow
# Fits the Metropolis-Hastings model to every ETF in the config (Yahoo Finance prices), predicts, then audits.
on:
  workflow_dispatch:
    inputs:
      config:
        description: "Config file that lists the ETFs"
        default: "config/markov_etfs.toml"
      paths:
        description: "Simulated futures per fund"
        default: "10000"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Tests
        run: uv run --with pytest python -m pytest -q
      - name: Fit and predict
        env:
          CONFIG: ${{ inputs.config }}
          PATHS: ${{ inputs.paths }}
        run: |
          set -o pipefail
          uv run python -m mcsim.mh_etfs --config "$CONFIG" --out results_mh_etfs --paths "$PATHS" 2>&1 | { grep -v "Warning\|^See https\|\.set_index\|\.sort_index\|\.rename\|\.drop" || true; }
      - name: Audit
        run: |
          set -o pipefail
          uv run python -m mcsim.mh_audit --out results_mh_etfs 2>&1 | { grep -v "Warning\|^See https" || true; }
      - name: Summary
        if: always()
        run: |
          cat results_mh_etfs/AUDIT.md >> "$GITHUB_STEP_SUMMARY" || true
          cat results_mh_etfs/RESULTS.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A results_mh_etfs
          if git diff --cached --quiet; then echo "No changes."; else
            git commit -m "Update Metropolis-Hastings results"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
